<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Administrator Login</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            width:360px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 18px rgba(0,0,0,.15);
        }

        h2{
            margin-bottom:25px;
            text-align:center;
        }

        input{
            width:100%;
            margin-bottom:15px;
            padding:10px;
        }

        button{
            width:100%;
            padding:10px;
        }
    </style>
</head>

<body>

<div class="card">

<h2>Administrator Login</h2>

<input placeholder="Username">

<input
type="password"
placeholder="Password">

<button>Sign In</button>

</div>

</body>
</html>
