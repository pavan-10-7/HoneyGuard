<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WordPress › Login</title>

<style>
body{
    background:#f0f0f1;
    font-family:Arial,sans-serif;
}

.container{
    width:340px;
    margin:80px auto;
}

.logo{
    text-align:center;
    font-size:32px;
    color:#2271b1;
    margin-bottom:20px;
}

.card{
    background:white;
    border:1px solid #dcdcde;
    padding:24px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:10px;
    background:#2271b1;
    color:white;
    border:none;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<div class="logo">
WordPress
</div>

<div class="card">

<input placeholder="Username or Email">

<input
type="password"
placeholder="Password">

<button>Log In</button>

</div>

</div>

</body>

</html>
